name: Docker update

inputs:
  add_tags:
    description: 'Indicates if the docker image should be tagged with the commit SHA (and the release tag if provided) even if it was not rebuilt'
    type: bool
    required: true
  release_tag:
    description: 'A tag for the release version'
    type: string
    required: false
    default: ''
outputs:
  image_tag:
    description: "The image tag that should be used after this action"
    value: ${{ steps.image_tag.outputs.image_tag }}

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/changed_files
    - id: rebuild-check
      run: |
        # Check if docker/gyselalibxx_env/Dockerfile has been modified
        changed_docker_file=$(cat changed_files.txt | grep "docker/gyselalibxx_env/Dockerfile" || true)
        echo "Changed files are"
        cat changed_files.txt
        # Use the modification status of docker/gyselalibxx_env/Dockerfile to decide if the docker should be rebuilt
        if [ -n "${changed_docker_file}" ]
        then
          echo "Dockerfile has changed"
          echo "rebuild=true" >> $GITHUB_OUTPUT
        else
          echo "Dockerfile has not changed"
          echo "rebuild=false" >> $GITHUB_OUTPUT
        fi
      shell: bash
    - name: Build final tags
      id: get-tags
      if: (inputs.add_tags == 'true') || (steps.rebuild-check.outputs.rebuild == 'true')
      run: |
        import os
        sha_tag = "ghcr.io/gyselax/gyselalibxx_env:${{ github.event.pull_request.head.sha || github.SHA }}"
        release_tag = "ghcr.io/gyselax/gyselalibxx_env:${{ inputs.release_tag }}"
        # Build a CSV representation of the tags
        full_tags = sha_tag + ('' if release_tag.endswith(":") else (','+release_tag))
        # Save the CSV to the outputs for use in the build-push-action
        print("full_tags=", full_tags, file=open(os.environ["GITHUB_OUTPUT"], 'a'), sep='')
      shell: python
    - name: Set up Docker Buildx
      if: steps.rebuild-check.outputs.rebuild == 'true'
      uses: docker/setup-buildx-action@v4
      with:
        # Build the Dockerfile stages one at a time. Each stage already compiles in parallel
        # so building several stages at once would exceed the memory available on the runner
        buildkitd-config-inline: |
          [worker.oci]
            max-parallelism = 1
    - name: Login to GitHub Container Registry
      if: (inputs.add_tags == 'true') || (steps.rebuild-check.outputs.rebuild == 'true')
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}
    - name: Build and push to tag
      if: steps.rebuild-check.outputs.rebuild == 'true'
      uses: docker/build-push-action@v7
      with:
        context: ./docker/gyselalibxx_env
        # Store the cache for every layer (mode=max) in a separate tag so that unchanged
        # layers are not rebuilt when the Dockerfile is modified
        cache-from: type=registry,ref=ghcr.io/gyselax/gyselalibxx_env:buildcache
        cache-to: type=registry,ref=ghcr.io/gyselax/gyselalibxx_env:buildcache,mode=max
        pull: true
        push: true
        tags: ${{ steps.get-tags.outputs.full_tags }}
    - name: Add tags to the existing image
      if: (inputs.add_tags == 'true') && (steps.rebuild-check.outputs.rebuild == 'false')
      env:
        FULL_TAGS: ${{ steps.get-tags.outputs.full_tags }}
      run: |
        # The Dockerfile is unchanged so the latest image is reused. The new tags are added
        # directly in the registry without pulling or rebuilding the image.
        tag_args=()
        IFS=',' read -ra tags <<< "${FULL_TAGS}"
        for tag in "${tags[@]}"
        do
          tag_args+=(--tag "${tag}")
        done
        docker buildx imagetools create "${tag_args[@]}" ghcr.io/gyselax/gyselalibxx_env:latest
      shell: bash
    - name: Pick image tag for subsequent jobs
      id: image_tag
      run: |
        if [ "${{ (inputs.add_tags == 'true') || (steps.rebuild-check.outputs.rebuild == 'true') }}" == "true" ]
        then
          echo "image_tag=ghcr.io/gyselax/gyselalibxx_env:${{ github.event.pull_request.head.sha || github.SHA }}" >> $GITHUB_OUTPUT
        else
          echo "image_tag=ghcr.io/gyselax/gyselalibxx_env:latest" >> $GITHUB_OUTPUT
        fi
      shell: bash
