name: "Filter tests"

runs:
  using: "composite"
  steps:
  - uses: ./.github/actions/changed_files
  - name: "Check filters"
    if: github.event_name == 'pull_request' || github.event_name == 'merge_request'
    run: |
      changed_files=$(awk '{printf("%s ",$0)} END { printf "\n" }' changed_files.txt)
      echo "CHANGED_FILES=${changed_files}" >> $GITHUB_ENV
      FOUND_POLAR_SPLINES=$(grep "src/interpolation/polar_splines/.*" -x changed_files.txt || true)
      if [ -n "$FOUND_POLAR_SPLINES" ]; then echo "GYSELALIBXX_POLAR_SPLINES_TEST_DEGREE_MIN=1" >> $GITHUB_ENV; echo "GYSELALIBXX_POLAR_SPLINES_TEST_DEGREE_MIN=6" >> $GITHUB_ENV; fi
    shell: bash
  - name: "Check filters"
    if: github.event_name != 'pull_request' && github.event_name != 'merge_request'
    run: |
      echo "GYSELALIBXX_POLAR_SPLINES_TEST_DEGREE_MIN=1" >> $GITHUB_ENV
      echo "GYSELALIBXX_POLAR_SPLINES_TEST_DEGREE_MIN=6" >> $GITHUB_ENV
    shell: bash

