spack:
  definitions:
  - packages:
    - cmake
    - 'ddc@0.14 +fft +pdi +splines'
    - ginkgo@1.9 +openmp
    - gmgpolar@2.3
    - googletest +gmock
    - kokkos@4.7 +openmp
    - kokkos-kernels@4.7
    - kokkos-tools@git.3d33d0a783c5321d6981b3b4e43d3c157d2ca887=develop
    - 'koliop@0.1.2:0.1'
    - lapack
    - mpi
    - ninja
    - paraconf
    - pdi@1.10.1:1
    - pdiplugin-decl-hdf5 +mpi
    - pdiplugin-decl-netcdf +mpi
    - pdiplugin-mpi
    - pdiplugin-pycall
    - pdiplugin-set-value
    - pdiplugin-trace
    - 'python@3.13'

    - py-dask
    - py-h5py
    - py-imageio
    - py-matplotlib
    - py-netcdf4 +mpi
    - py-numpy
    - py-pyyaml
    - py-scipy
    - py-sympy
    - py-xarray
  - architectures:
    - arch=linux-rhel8-zen4
  specs:
  - matrix:
    - [$packages]
    - [$architectures]
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2025.11
    builtin:
      tag: v2025.11.0
  concretizer:
    unify: true
    reuse: false
    duplicates:
      strategy: none
  packages:
    all:
      permissions:
        read: world
        write: group
      variants: ~fortran ~mpi
    c:
      require: gcc@13.3.1
    cxx:
      require: gcc@13.3.1
    kokkos-fft:
      require: 'host_backend=fftw-openmp'
    lapack:
      require: openblas
    mpi:
      require: cray-mpich
    py-dask:
      prefer: ['~dataframe']
    py-pandas:
      prefer: ['~performance']
  modules:
    default:
      roots: {}
      enable: []
  view: false
