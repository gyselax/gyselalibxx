spack:
  include:
    - packages.yaml
  definitions:
  - packages:
    - cmake@3.31
    - 'ddc@0.16 +fft +pdi +splines'
    - ginkgo@1.11 ~openmp +rocm amdgpu_target=gfx90a
    - gmgpolar@2.4
    - googletest@1.17 +gmock
    - kokkos@5.1 ~openmp +rocm amdgpu_target=gfx90a
    - kokkos-kernels@5.1 ~shared
    - kokkos-tools@5.2
    - 'koliop@0.2'
    - lapack
    - mpi
    - ninja@1.13
    - paraconf@1.0
    - pdi@1.11
    - pdiplugin-decl-hdf5@1.11 +mpi
    - pdiplugin-decl-netcdf@1.11 +mpi
    - pdiplugin-mpi@1.11
    - pdiplugin-pycall@1.11
    - pdiplugin-set-value@1.11
    - pdiplugin-trace@1.11
    - python@3.13

    - py-dask
    - py-h5py
    - py-imageio
    - py-matplotlib
    - py-netcdf4 +mpi
    - py-numpy
    - py-pyyaml
    - py-scipy
    - py-sympy
    - py-xarray
    - py-deisa-dask@0.6.3 +mpi
    - py-deisa-ray
    - py-iops-benchmark
    - py-dask-ml@2025.1.0
  - architectures:
    - arch=linux-rhel8-zen3
  specs:
  - gcc
  - matrix:
    - [$packages]
    - [$architectures]
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.10
      paths:
        - spack_repo/patches_adastra
        - spack_repo/patches_common
      destination: $spack/var/spack/repos/patches-v2026.10
    builtin:
      branch: releases/v2026.10
      destination: $spack/var/spack/repos/builtin-v2026.10
  concretizer:
    reuse: false
    unify: true
  packages:
    all:
      permissions:
        read: world
        write: group
      variants: ~fortran ~mpi
    arrow:
      prefer:
        - '~mimalloc'
    c:
      require: gcc@13.3.1
    cxx:
      require: gcc@13.3.1
    hdf5:
      require: '+subfiling'
    kokkos-fft:
      require: 'host_backend=fftw-serial'
    lapack:
      require: openblas@0.3
    mpi:
      require: cray-mpich
    py-dask:
      prefer:
        - '~dataframe'
    py-pandas:
      prefer:
        - '~performance'
