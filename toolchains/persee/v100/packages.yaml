---
packages:
  all:
    permissions:
      read: group
      write: group
  c:
    require: gcc@13.2.0
  cxx:
    require: gcc@13.2.0
  cuda:
    externals:
    - spec: cuda@12.9.86
      prefix: /usr/local/cuda
  gcc:
    externals:
    - spec: gcc@13.2.0 languages:='c,c++,fortran'
      prefix: /Applications/compilers/gcc/13.2.0
      extra_attributes:
        compilers:
          c: /Applications/compilers/gcc/13.2.0/bin/gcc
          cxx: /Applications/compilers/gcc/13.2.0/bin/g++
          fortran: /Applications/compilers/gcc/13.2.0/bin/gfortran
        environment:
          prepend_path:
            LD_LIBRARY_PATH: /Applications/compilers/gcc/13.2.0/lib64:/Applications/compilers/gcc/13.2.0/lib
  ginkgo:
    require: '+openmp +cuda cuda_arch=70'
  kokkos:
    require: '+openmp +wrapper +cuda cuda_arch=70'
  kokkos-fft:
    require: 'host_backend=fftw-openmp'
  kokkos-kernels:
    require: '~shared'
  lapack:
    require: openblas@0.3
  mpi:
    require: openmpi@5.0 +cuda
