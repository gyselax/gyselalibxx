spack:
  concretizer:
    reuse: false
    unify: true
  config:
    install_tree:
      padded_length: 128
  definitions:
  - packages:
    - 'cmake@3.31'
    - 'ddc@0.15 +fft +pdi +splines'
    - 'ginkgo@1.11'
    - 'gmgpolar@2.3'
    - 'googletest@1.17 +gmock'
    - 'kokkos@5.1 +serial'
    - 'kokkos-kernels@5.1'
    - 'kokkos-tools@git.3d33d0a783c5321d6981b3b4e43d3c157d2ca887=develop'
    - 'koliop@0.2'
    - 'lapack'
    - 'mpi'
    - 'paraconf@1.0'
    - 'pdi@1.11'
    - 'pdiplugin-decl-hdf5@1.11 +mpi'
    - 'pdiplugin-decl-netcdf@1.11 +mpi'
    - 'pdiplugin-mpi@1.11'
    - 'pdiplugin-set-value@1.11'
    - 'pdiplugin-trace@1.11'
    - 'python@3.14'
  - linux-packages:
      - 'pdiplugin-pycall@1.11'
    when: platform!="darwin"
  - python-packages:
    - 'py-dask@2025.7'
    - 'py-h5py@3.12'
    - 'py-imageio@2.35'
    - 'py-matplotlib@3.9'
    - 'py-netcdf4@1.7 +mpi'
    - 'py-numpy@2.1'
    - 'py-pyyaml@6.0'
    - 'py-scipy@1.14'
    - 'py-sympy@1.13'
    - 'py-xarray@2024.7'
  specs:
  - matrix:
    - [$packages]
  - matrix:
    - [$linux-packages]
  - matrix:
    - [$python-packages]
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.06
    builtin:
      branch: releases/v2026.06
  view: true
  packages:
    all:
      variants: ~fortran ~mpi ~openmp cxxstd=17
    blas:
      require: openblas@0.3
    c:
      require:
        - spec: 'apple-clang@14:'
          when: platform=darwin
        - spec: 'gcc@11:'
          when: platform=linux
    cxx:
      require:
        - spec: 'apple-clang@14:'
          when: platform=darwin
        - spec: 'gcc@11:'
          when: platform=linux
    fortran:
      require: 'gcc@11:'
    kokkos-fft:
      require: 'host_backend=fftw-serial'
    lapack:
      require: openblas@0.3
    mpi:
      require: openmpi@5.0
    pdi:
      require:
        - spec: ~python
          when: platform=darwin
    py-dask:
      prefer: ['~dataframe']
    py-pandas:
      prefer: ['~performance']
