spack:
  concretizer:
    reuse: false
    unify: true
  config:
    install_tree:
      padded_length: 128
  definitions:
  - packages:
    - 'cmake@3.31'
    - 'ddc@0.16 +fft +pdi +splines'
    - 'ginkgo@1.11'
    - 'gmgpolar@2.4'
    - 'googletest@1.17 +gmock'
    - 'kokkos@5.1 +serial'
    - 'kokkos-kernels@5.1'
    - 'kokkos-tools@5.2'
    - 'koliop@0.2'
    - 'lapack'
    - 'mpi'
    - 'paraconf@1.0'
    - 'pdi@1.11'
    - 'pdiplugin-decl-hdf5@1.11 +mpi'
    - 'pdiplugin-decl-netcdf@1.11 +mpi'
    - 'pdiplugin-mpi@1.11'
    - 'pdiplugin-pycall@1.11'
    - 'pdiplugin-set-value@1.11'
    - 'pdiplugin-trace@1.11'
    - 'python@3.14'
  - python-packages:
    - 'py-dask@2026.3'
    - 'py-gvec@1.4'
    - 'py-h5py@3.16'
    - 'py-imageio@2.37'
    - 'py-matplotlib@3.11'
    - 'py-netcdf4@1.7 +mpi'
    - 'py-numpy@2.4'
    - 'py-pyyaml@6.0'
    - 'py-scipy@1.17'
    - 'py-sympy@1.14'
    - 'py-xarray@2026.4'
  specs:
  - matrix:
    - [$packages]
  - matrix:
    - [$python-packages]
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.10
    builtin:
      branch: releases/v2026.10
  view: true
  packages:
    all:
      variants: ~fortran ~mpi ~openmp cxxstd=17
    arrow:
      prefer:
        - '~mimalloc'
    blas:
      require: openblas@0.3
    c:
      require:
        - spec: 'apple-clang@14:'
          when: platform=darwin
        - spec: 'gcc@11:'
          when: platform=linux
    cxx:
      require:
        - spec: 'apple-clang@14:'
          when: platform=darwin
        - spec: 'gcc@11:'
          when: platform=linux
    fortran:
      require: 'gcc@11:'
    hdf5:
      require: '+subfiling'
    kokkos-fft:
      require: 'host_backend=fftw-serial'
    lapack:
      require: openblas@0.3
    mpi:
      require: openmpi@5.0
    py-dask:
      prefer:
        - '~dataframe'
    py-pandas:
      prefer:
        - '~performance'
