---
packages:
  all:
    permissions:
      read: group
      write: group
    prefer:
      - 'target=sapphirerapids'
  c:
    require: gcc@14.2.0
  cxx:
    require: gcc@14.2.0
  cuda:
    buildable: false
    externals:
    - spec: cuda@12.8.61
      prefix: /lustre/fshomisc/sys/common/nvidia/cuda/12.8
  gcc:
    externals:
    - spec: gcc@14.2.0 languages:='c,c++,fortran'
      prefix: /lustre/fshomisc/sup/spack_soft/gcc/14.2.0/gcc-11.3.1-sqtxme5svnnm5uzzhqtrderrwbhwkg6o
      extra_attributes:
          compilers:
            c: /lustre/fshomisc/sup/spack_soft/gcc/14.2.0/gcc-11.3.1-sqtxme5svnnm5uzzhqtrderrwbhwkg6o/bin/gcc
            cxx: /lustre/fshomisc/sup/spack_soft/gcc/14.2.0/gcc-11.3.1-sqtxme5svnnm5uzzhqtrderrwbhwkg6o/bin/g++
            fortran: /lustre/fshomisc/sup/spack_soft/gcc/14.2.0/gcc-11.3.1-sqtxme5svnnm5uzzhqtrderrwbhwkg6o/bin/gfortran
          environment:
            prepend_path:
              LD_LIBRARY_PATH: /lustre/fshomisc/sys/common/nvidia/cuda/12.8/lib64:/lustre/fshomisc/sys/common/nvidia/cuda/12.8/extras/CUPTI/lib64:/lustre/fshomisc/sys/common/nvidia/cuda/12.8/nvvm/lib64
  openmpi:
    buildable: false
    externals:
    - spec: openmpi@4.1.6+cuda~cxx~cxx_exceptions~java+lustre~memchecker+pmi~static~wrapper-rpath
        fabrics=ucx schedulers=slurm
      prefix: /lustre/fshomisc/sup/spack_soft/openmpi/4.1.6/gcc-11.4.1-hbuwwfts4cctbzqir427u56mkk6zu3qr
  ginkgo:
    require: '~openmp +cuda cuda_arch=90'
  kokkos:
    require: '~openmp +cuda cuda_arch=90'
  kokkos-fft:
    require: 'host_backend=fftw-serial'
  kokkos-kernels:
    require: '~shared'
  lapack:
    require: openblas@0.3 ~dynamic_dispatch
  mpi:
    require: openmpi@4.1
